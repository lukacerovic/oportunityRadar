# seed/categories.yaml — controlled category vocabulary (doc 04 §5). ~30 values.
# Category is the computational key for cohorts (doc 06) and reach (doc 07). Each entry has:
#   keywords: matched (word-boundary, case-insensitive) against README/abstract/card text for
#             deterministic assignment (identity/category.py). Order in this file is priority:
#             the first category with a keyword hit wins, so put specific before generic.
#   theme:    default narrative theme (must exist in seed/themes.yaml); overridable in dashboard.
# Every category here must have >=1 keyword and a valid theme. Changing a slug is a data
# migration, not an edit — slugs are referenced by reach_links and cohorts.


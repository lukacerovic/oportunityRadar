# seed/seed_entities.yaml — hand-curated day-1 universe (doc 14 §3).
# Coverage rule (§3.2): 3–8 best-known members per category, so every category has cohort seed
# mass. These are registry anchors, not opinions. Anchor keys: github (owner/repo or org), pypi,
# npm, arxiv, hf (org/model or org). Categories must match seed/categories.yaml slugs; themes must
# match seed/themes.yaml. The loader emits one seed_anchor event per anchor; resolve collapses a
# block's anchors into one entity and merges discovered entities into it via R1–R3.


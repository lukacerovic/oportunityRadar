# Reflection-70B — flop, negative (doc 11 §3). Sept 2024: an enormous HN/attention spike plus an HF
# presence, whose claims collapsed within days — no distribution, no commitment. This is the case
# that makes the positive cases mean something: attention alone must NOT earn a brief.
#
# The system may register the attention (momentum can briefly reach `simmering`), but the gate must
# suppress it (H3) and NO brief may exist. Suppression here is structural: an attention-only spike
# never climbs to accelerating/breakout (attention is excluded from the velocity composite,
# idea-spec principle 3), so it never even becomes a gate candidate.
#
# NOTE (loader status, doc 11 §1): HN attention loads (Algolia is natively historical) and the HF
# loader now resolves the model entity via `?author=` createdAt (§25). What is NOT reconstructable is
# the Sept-2024 HF *download curve* — the API returns only the current 30-day level, not history — so
# the usage-velocity spike that would have driven `simmering` cannot be replayed. This is fine: by
# design attention is EXCLUDED from the velocity composite (idea-spec principle 3), so a pure hype
# spike must NOT manufacture momentum. H3a therefore asserts the true invariant — the flop never
# reached accelerating/breakout — which is exactly what H3b (gate suppression) guarantees downstream.
case: reflection70b
window: {from: 2024-09-01, to: 2024-09-30}

seeds:
  hf_orgs: ["mattshumer/Reflection-Llama-3.1-70B"]
  # HN attention is the real signal here; Algolia is natively historical (doc 11 §1) once wired.

assertions:
  # The true "hype ≠ momentum" invariant: a pure attention spike (excluded from the velocity
  # composite) must NEVER climb to accelerating/breakout, so it can never earn a brief.
  - id: H3a
    type: momentum
    mode: never
    entity: "hf:mattshumer/Reflection-Llama-3.1-70B"
    states: [accelerating, breakout]
    as_of: 2024-09-30

  # H3 — the gate must never pass it (attention without distribution/commitment is not significant).
  - id: H3b
    type: gate
    entity: "hf:mattshumer/Reflection-Llama-3.1-70B"
    decision: suppressed

  # …and therefore no brief may exist for it, in any status.
  - id: H3c
    type: brief_absent
    entity: "hf:mattshumer/Reflection-Llama-3.1-70B"
